<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lenape Bronx Map — Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
    h1 { font-size: 22px; margin-bottom: 6px; }
    .subtitle { color: #94a3b8; margin-bottom: 24px; font-size: 14px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab { padding: 8px 16px; border: 1px solid #334155; border-radius: 6px; background: transparent; color: #94a3b8; cursor: pointer; font-size: 14px; }
    .tab--active { background: #1e40af; color: #fff; border-color: #1e40af; }
    .tab .count { background: #ef4444; color: #fff; border-radius: 10px; padding: 1px 7px; font-size: 11px; margin-left: 6px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 16px; margin-bottom: 12px; }
    .card__header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .card__title { font-size: 16px; font-weight: 600; }
    .card__status { font-size: 12px; padding: 3px 10px; border-radius: 12px; }
    .card__status--pending { background: #78350f; color: #fbbf24; }
    .card__status--approved { background: #064e3b; color: #34d399; }
    .card__field { margin-bottom: 6px; font-size: 14px; color: #cbd5e1; }
    .card__field strong { color: #e2e8f0; }
    .card__note { background: #0f172a; padding: 10px; border-radius: 6px; margin: 8px 0; font-size: 14px; line-height: 1.5; }
    .card__photos { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
    .card__photos img { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; cursor: pointer; }
    .card__actions { display: flex; gap: 8px; margin-top: 10px; }
    .btn { padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; }
    .btn--approve { background: #059669; color: #fff; }
    .btn--approve:hover { background: #047857; }
    .btn--reject { background: #dc2626; color: #fff; }
    .btn--reject:hover { background: #b91c1c; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .empty { color: #64748b; text-align: center; padding: 40px; font-size: 14px; }
    a { color: #60a5fa; }
    .timestamp { color: #64748b; font-size: 12px; }
    #login { max-width: 360px; margin: 80px auto; text-align: center; }
    #login input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; font-size: 14px; margin: 12px 0; }
    #login button { width: 100%; padding: 10px; border-radius: 6px; border: none; background: #1e40af; color: #fff; font-size: 14px; cursor: pointer; }
    #login button:hover { background: #1d4ed8; }
    #login .error { color: #f87171; font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>

  <!-- Simple password gate -->
  <div id="login">
    <h1>Admin Panel</h1>
    <p class="subtitle">Lenape Bronx Map</p>
    <input type="password" id="admin-pass" placeholder="Enter admin password" onkeydown="if(event.key==='Enter')checkLogin()">
    <button onclick="checkLogin()">Log In</button>
    <div id="login-error" class="error"></div>
  </div>

  <!-- Admin dashboard (hidden until login) -->
  <div id="dashboard" style="display:none">
    <h1>Lenape Bronx Map — Admin</h1>
    <p class="subtitle">Review and approve student submissions</p>

    <div class="tabs">
      <button class="tab tab--active" data-tab="annotations" onclick="switchTab('annotations')">
        Notes <span class="count" id="count-annotations">0</span>
      </button>
      <button class="tab" data-tab="submissions" onclick="switchTab('submissions')">
        Site Proposals <span class="count" id="count-submissions">0</span>
      </button>
    </div>

    <div id="list"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script>
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyAmfoJ7SSz5TnUTQ6c0RL5fDoeJD_HKrhg",
      authDomain: "lenape-bronx-map.firebaseapp.com",
      projectId: "lenape-bronx-map",
      storageBucket: "lenape-bronx-map.firebasestorage.app",
      messagingSenderId: "866654319434",
      appId: "1:866654319434:web:48c0528863564f1ac1c7b3"
    };
    firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.firestore();

    // ── Simple password gate ────────────────────────────────────────────
    // Hash of admin password stored here. Change by updating the hash.
    // Default password: "lenape2026" — change this!
    const ADMIN_HASH = '8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918'; // sha256 of "admin"

    async function sha256(str) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function checkLogin() {
      const pass = document.getElementById('admin-pass').value;
      const hash = await sha256(pass);
      // Accept either "admin" (default) or check against stored hash
      // For real security, use Firebase Auth — this just keeps casual visitors out
      if (hash === ADMIN_HASH || pass === 'lenape2026') {
        document.getElementById('login').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        sessionStorage.setItem('admin_auth', '1');
        loadData();
      } else {
        document.getElementById('login-error').textContent = 'Wrong password.';
      }
    }

    // Auto-login if already authenticated this session
    if (sessionStorage.getItem('admin_auth') === '1') {
      document.getElementById('login').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      window.addEventListener('DOMContentLoaded', loadData);
    }

    // ── Data ────────────────────────────────────────────────────────────
    let allAnnotations = [];
    let allSubmissions = [];
    let currentTab = 'annotations';

    async function loadData() {
      const [annSnap, subSnap] = await Promise.all([
        db.collection('annotations').orderBy('createdAt', 'desc').get(),
        db.collection('submissions').orderBy('createdAt', 'desc').get(),
      ]);
      allAnnotations = annSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      allSubmissions = subSnap.docs.map(d => ({ id: d.id, ...d.data() }));

      document.getElementById('count-annotations').textContent =
        allAnnotations.filter(a => a.status === 'pending').length;
      document.getElementById('count-submissions').textContent =
        allSubmissions.filter(s => s.status === 'pending').length;

      render();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => {
        t.classList.toggle('tab--active', t.dataset.tab === tab);
      });
      render();
    }

    function esc(str) {
      const d = document.createElement('div');
      d.textContent = str || '';
      return d.innerHTML;
    }

    function fmtDate(ts) {
      if (!ts) return '';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
    }

    function render() {
      const list = document.getElementById('list');
      const items = currentTab === 'annotations' ? allAnnotations : allSubmissions;

      if (items.length === 0) {
        list.innerHTML = '<div class="empty">No items yet.</div>';
        return;
      }

      // Show pending first, then approved
      const sorted = [...items].sort((a, b) => {
        if (a.status === 'pending' && b.status !== 'pending') return -1;
        if (a.status !== 'pending' && b.status === 'pending') return 1;
        return 0;
      });

      list.innerHTML = sorted.map(item => {
        const isPending = item.status === 'pending';
        const collection = currentTab;

        let body = '';
        if (currentTab === 'annotations') {
          body = `
            <div class="card__field"><strong>Settlement ID:</strong> ${esc(String(item.settlementId))}</div>
            <div class="card__note">${esc(item.note)}</div>
          `;
        } else {
          body = `
            <div class="card__field"><strong>Site:</strong> ${esc(item.name)}</div>
            <div class="card__field"><strong>Location:</strong> ${item.lat ? item.lat.toFixed(5) + '°N, ' + Math.abs(item.lng).toFixed(5) + '°W' : 'N/A'}</div>
            <div class="card__note">${esc(item.description)}</div>
          `;
        }

        const photos = (item.photos || []).map(url =>
          `<img src="${esc(url)}" alt="Photo" onclick="window.open('${esc(url)}')">`
        ).join('');

        const sources = (item.sources || []).map(s =>
          `<a href="${esc(s)}" target="_blank" rel="noopener">${esc(s)}</a>`
        ).join(', ');

        return `
          <div class="card" id="card-${item.id}">
            <div class="card__header">
              <div>
                <span class="card__title">${esc(item.studentName)}</span>
                <span class="timestamp"> · ${esc(item.school)} · ${fmtDate(item.createdAt)}</span>
              </div>
              <span class="card__status card__status--${item.status}">${item.status}</span>
            </div>
            ${body}
            ${photos ? `<div class="card__photos">${photos}</div>` : ''}
            ${sources ? `<div class="card__field"><strong>Sources:</strong> ${sources}</div>` : ''}
            ${item.videoUrl ? `<div class="card__field"><strong>Video:</strong> <a href="${esc(item.videoUrl)}" target="_blank" rel="noopener">${esc(item.videoUrl)}</a></div>` : ''}
            <div class="card__actions">
              ${isPending ? `
                <button class="btn btn--approve" onclick="setStatus('${collection}','${item.id}','approved')">Approve</button>
                <button class="btn btn--reject" onclick="setStatus('${collection}','${item.id}','rejected')">Reject</button>
              ` : `
                <button class="btn btn--reject" onclick="setStatus('${collection}','${item.id}','pending')">Revert to Pending</button>
              `}
            </div>
          </div>
        `;
      }).join('');
    }

    async function setStatus(collection, docId, newStatus) {
      const card = document.getElementById('card-' + docId);
      const btns = card.querySelectorAll('.btn');
      btns.forEach(b => b.disabled = true);

      try {
        await db.collection(collection).doc(docId).update({ status: newStatus });
        await loadData();
      } catch (err) {
        console.error('Status update failed:', err);
        alert('Failed to update. Check console.');
        btns.forEach(b => b.disabled = false);
      }
    }
  </script>
</body>
</html>
