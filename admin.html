<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lenape Bronx Map — Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
    h1 { font-size: 22px; margin-bottom: 6px; }
    .subtitle { color: #94a3b8; margin-bottom: 24px; font-size: 14px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab { padding: 8px 16px; border: 1px solid #334155; border-radius: 6px; background: transparent; color: #94a3b8; cursor: pointer; font-size: 14px; }
    .tab--active { background: #1e40af; color: #fff; border-color: #1e40af; }
    .tab .count { background: #ef4444; color: #fff; border-radius: 10px; padding: 1px 7px; font-size: 11px; margin-left: 6px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 16px; margin-bottom: 12px; }
    .card__header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .card__title { font-size: 16px; font-weight: 600; }
    .card__status { font-size: 12px; padding: 3px 10px; border-radius: 12px; }
    .card__status--pending { background: #78350f; color: #fbbf24; }
    .card__status--approved { background: #064e3b; color: #34d399; }
    .card__field { margin-bottom: 6px; font-size: 14px; color: #cbd5e1; }
    .card__field strong { color: #e2e8f0; }
    .card__note { background: #0f172a; padding: 10px; border-radius: 6px; margin: 8px 0; font-size: 14px; line-height: 1.5; }
    .card__photos { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
    .card__photos img { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; cursor: pointer; }
    .card__actions { display: flex; gap: 8px; margin-top: 10px; }
    .btn { padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; }
    .btn--approve { background: #059669; color: #fff; }
    .btn--approve:hover { background: #047857; }
    .btn--reject { background: #dc2626; color: #fff; }
    .btn--reject:hover { background: #b91c1c; }
    .btn--delete { background: #581c87; color: #fff; }
    .btn--delete:hover { background: #4a044e; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .empty { color: #64748b; text-align: center; padding: 40px; font-size: 14px; }
    .leaderboard { width: 100%; border-collapse: collapse; }
    .leaderboard th { text-align: left; padding: 10px 14px; border-bottom: 2px solid #334155; color: #94a3b8; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .leaderboard td { padding: 10px 14px; border-bottom: 1px solid #1e293b; font-size: 14px; }
    .leaderboard tr:hover td { background: #1e293b; }
    .leaderboard .rank { color: #64748b; width: 40px; }
    .leaderboard .name { font-weight: 500; }
    .leaderboard .num { text-align: center; width: 90px; }
    .leaderboard .total { font-weight: 700; color: #60a5fa; }
    .medal { font-size: 16px; margin-right: 4px; }
    a { color: #60a5fa; }
    .timestamp { color: #64748b; font-size: 12px; }
    #login { max-width: 360px; margin: 80px auto; text-align: center; }
    #login input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; font-size: 14px; margin: 12px 0; }
    #login button { width: 100%; padding: 10px; border-radius: 6px; border: none; background: #1e40af; color: #fff; font-size: 14px; cursor: pointer; }
    #login button:hover { background: #1d4ed8; }
    #login .error { color: #f87171; font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>

  <!-- Google sign-in gate -->
  <div id="login">
    <h1>Admin Panel</h1>
    <p class="subtitle">Lenape Bronx Map</p>
    <button id="signin-btn" onclick="signInWithGoogle()" style="display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#3c4043;border:1px solid #dadce0;font-weight:500">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/><path d="M3.964 10.706A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.038l3.007-2.332z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.962L3.964 7.294C4.672 5.167 6.656 3.58 9 3.58z" fill="#EA4335"/></svg>
      Sign in with Google
    </button>
    <div id="login-error" class="error"></div>
  </div>

  <!-- Admin dashboard (hidden until login) -->
  <div id="dashboard" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px">
      <div>
        <h1 style="margin:0">Lenape Bronx Map — Admin</h1>
        <p class="subtitle" style="margin:2px 0 0">Review and approve student submissions</p>
        <p id="current-user" style="font-size:12px;color:#6b7280;margin:4px 0 0"></p>
      </div>
      <button onclick="signOut()" style="background:#fff;color:#374151;border:1px solid #d1d5db;padding:6px 14px;font-size:13px;cursor:pointer;border-radius:6px">Sign out</button>
    </div>

    <button class="btn btn--approve" onclick="exportAllData()" style="margin-bottom:16px;padding:8px 16px;font-size:14px;">⬇ Download All Data</button>

    <div class="tabs">
      <button class="tab tab--active" data-tab="annotations" onclick="switchTab('annotations')">
        Notes <span class="count" id="count-annotations">0</span>
      </button>
      <button class="tab" data-tab="submissions" onclick="switchTab('submissions')">
        Site Proposals <span class="count" id="count-submissions">0</span>
      </button>
      <button class="tab" data-tab="leaderboard" onclick="switchTab('leaderboard')">
        Leaderboard
      </button>
    </div>

    <div id="list"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script>
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyAmfoJ7SSz5TnUTQ6c0RL5fDoeJD_HKrhg",
      authDomain: "lenape-bronx-map.firebaseapp.com",
      projectId: "lenape-bronx-map",
      storageBucket: "lenape-bronx-map.firebasestorage.app",
      messagingSenderId: "866654319434",
      appId: "1:866654319434:web:48c0528863564f1ac1c7b3"
    };
    firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.firestore();
    const auth = firebase.auth();

    // ── Admin allowlist ────────────────────────────────────────────────
    // Emails allowed to sign in and manage the map. Add new admins here
    // AND in firestore.rules (keep the two in sync).
    const ADMIN_EMAILS = [
      'emile.giovannie@gmail.com'
    ];

    // ── Google sign-in ─────────────────────────────────────────────────
    async function signInWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        const result = await auth.signInWithPopup(provider);
        const email = result.user.email;
        if (!ADMIN_EMAILS.includes(email)) {
          document.getElementById('login-error').textContent =
            `${email} is not authorized. Sign out and contact Emile to be added.`;
          await auth.signOut();
          return;
        }
      } catch (err) {
        document.getElementById('login-error').textContent =
          'Sign-in failed: ' + (err.message || err.code);
      }
    }

    async function signOut() {
      await auth.signOut();
      location.reload();
    }

    // ── Auth state gate ────────────────────────────────────────────────
    auth.onAuthStateChanged((user) => {
      if (user && ADMIN_EMAILS.includes(user.email)) {
        document.getElementById('login').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        document.getElementById('current-user').textContent = 'Signed in as ' + user.email;
        loadData();
      } else {
        document.getElementById('login').style.display = 'flex';
        document.getElementById('dashboard').style.display = 'none';
      }
    });

    // ── Data ────────────────────────────────────────────────────────────
    let allAnnotations = [];
    let allSubmissions = [];
    let currentTab = 'annotations';

    async function loadData() {
      const [annSnap, subSnap] = await Promise.all([
        db.collection('annotations').orderBy('createdAt', 'desc').get(),
        db.collection('submissions').orderBy('createdAt', 'desc').get(),
      ]);
      allAnnotations = annSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      allSubmissions = subSnap.docs.map(d => ({ id: d.id, ...d.data() }));

      document.getElementById('count-annotations').textContent =
        allAnnotations.filter(a => a.status === 'pending').length;
      document.getElementById('count-submissions').textContent =
        allSubmissions.filter(s => s.status === 'pending').length;

      render();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => {
        t.classList.toggle('tab--active', t.dataset.tab === tab);
      });
      render();
    }

    function esc(str) {
      const d = document.createElement('div');
      d.textContent = str || '';
      return d.innerHTML;
    }

    function fmtDate(ts) {
      if (!ts) return '';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
    }

    function renderLeaderboard() {
      const list = document.getElementById('list');
      const counts = {};

      // Count annotations per student
      allAnnotations.forEach(a => {
        const name = (a.studentName || 'Unknown').trim();
        if (!counts[name]) counts[name] = { notes: 0, sites: 0, school: a.school || '' };
        counts[name].notes++;
        if (!counts[name].school && a.school) counts[name].school = a.school;
      });

      // Count site proposals per student
      allSubmissions.forEach(s => {
        const name = (s.studentName || 'Unknown').trim();
        if (!counts[name]) counts[name] = { notes: 0, sites: 0, school: s.school || '' };
        counts[name].sites++;
        if (!counts[name].school && s.school) counts[name].school = s.school;
      });

      const rows = Object.entries(counts)
        .map(([name, c]) => ({ name, ...c, total: c.notes + c.sites }))
        .sort((a, b) => b.total - a.total);

      if (rows.length === 0) {
        list.innerHTML = '<div class="empty">No student submissions yet.</div>';
        return;
      }

      const medals = ['&#129351;', '&#129352;', '&#129353;']; // gold, silver, bronze

      list.innerHTML = `
        <table class="leaderboard">
          <thead>
            <tr>
              <th class="rank">#</th>
              <th>Student</th>
              <th>School</th>
              <th class="num">Notes</th>
              <th class="num">Sites</th>
              <th class="num">Total</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map((r, i) => `
              <tr>
                <td class="rank">${i < 3 ? `<span class="medal">${medals[i]}</span>` : i + 1}</td>
                <td class="name">${esc(r.name)}</td>
                <td>${esc(r.school)}</td>
                <td class="num">${r.notes}</td>
                <td class="num">${r.sites}</td>
                <td class="num total">${r.total}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        <div style="color:#64748b;font-size:13px;margin-top:16px;text-align:right;">
          ${rows.length} students · ${allAnnotations.length} notes · ${allSubmissions.length} site proposals
        </div>
      `;
    }

    function render() {
      if (currentTab === 'leaderboard') return renderLeaderboard();

      const list = document.getElementById('list');
      const items = currentTab === 'annotations' ? allAnnotations : allSubmissions;

      if (items.length === 0) {
        list.innerHTML = '<div class="empty">No items yet.</div>';
        return;
      }

      // Show pending first, then approved
      const sorted = [...items].sort((a, b) => {
        if (a.status === 'pending' && b.status !== 'pending') return -1;
        if (a.status !== 'pending' && b.status === 'pending') return 1;
        return 0;
      });

      list.innerHTML = sorted.map(item => {
        const isPending = item.status === 'pending';
        const collection = currentTab;

        let body = '';
        if (currentTab === 'annotations') {
          body = `
            <div class="card__field"><strong>Settlement ID:</strong> ${esc(String(item.settlementId))}</div>
            <div class="card__note">${esc(item.note)}</div>
          `;
        } else {
          body = `
            <div class="card__field"><strong>Site:</strong> ${esc(item.name)}</div>
            <div class="card__field"><strong>Location:</strong> ${item.lat ? item.lat.toFixed(5) + '°N, ' + Math.abs(item.lng).toFixed(5) + '°W' : 'N/A'}</div>
            <div class="card__note">${esc(item.description)}</div>
          `;
        }

        const photos = (item.photos || []).map(url =>
          `<img src="${esc(url)}" alt="Photo" onclick="window.open('${esc(url)}')">`
        ).join('');

        const sources = (item.sources || []).map(s =>
          `<a href="${esc(s)}" target="_blank" rel="noopener">${esc(s)}</a>`
        ).join(', ');

        return `
          <div class="card" id="card-${item.id}">
            <div class="card__header">
              <div>
                <span class="card__title">${esc(item.studentName)}</span>
                <span class="timestamp"> · ${esc(item.school)} · ${fmtDate(item.createdAt)}</span>
              </div>
              <span class="card__status card__status--${item.status}">${item.status}</span>
            </div>
            ${item.email ? `<div class="card__field"><strong>Email:</strong> ${esc(item.email)}</div>` : ''}
            ${body}
            ${photos ? `<div class="card__photos">${photos}</div>` : ''}
            ${sources ? `<div class="card__field"><strong>Sources:</strong> ${sources}</div>` : ''}
            ${item.videoUrl ? `<div class="card__field"><strong>Video:</strong> <a href="${esc(item.videoUrl)}" target="_blank" rel="noopener">${esc(item.videoUrl)}</a></div>` : ''}
            <div class="card__actions">
              ${isPending ? `
                <button class="btn btn--approve" onclick="setStatus('${collection}','${item.id}','approved')">Approve</button>
                <button class="btn btn--reject" onclick="setStatus('${collection}','${item.id}','rejected')">Reject</button>
              ` : `
                <button class="btn btn--reject" onclick="setStatus('${collection}','${item.id}','pending')">Revert to Pending</button>
              `}
              <button class="btn btn--delete" onclick="deleteItem('${collection}','${item.id}')">Delete</button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function setStatus(collection, docId, newStatus) {
      const card = document.getElementById('card-' + docId);
      const btns = card.querySelectorAll('.btn');
      btns.forEach(b => b.disabled = true);

      try {
        await db.collection(collection).doc(docId).update({ status: newStatus });
        await loadData();
      } catch (err) {
        console.error('Status update failed:', err);
        alert('Failed to update. Check console.');
        btns.forEach(b => b.disabled = false);
      }
    }
    async function exportAllData() {
      try {
        const [annSnap, subSnap, backAnn, backSub] = await Promise.all([
          db.collection('annotations').get(),
          db.collection('submissions').get(),
          db.collection('backups_annotations').get().catch(() => ({ docs: [] })),
          db.collection('backups_submissions').get().catch(() => ({ docs: [] })),
        ]);
        const data = {
          exportedAt: new Date().toISOString(),
          annotations: annSnap.docs.map(d => ({ id: d.id, ...d.data() })),
          submissions: subSnap.docs.map(d => ({ id: d.id, ...d.data() })),
          backups_annotations: backAnn.docs.map(d => ({ id: d.id, ...d.data() })),
          backups_submissions: backSub.docs.map(d => ({ id: d.id, ...d.data() })),
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `lenape-map-export-${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
      } catch (err) {
        console.error('Export failed:', err);
        alert('Export failed. Check console.');
      }
    }

    async function deleteItem(collection, docId) {
      if (!confirm('Are you sure you want to delete this? This cannot be undone (backup copy will remain).')) return;

      const card = document.getElementById('card-' + docId);
      const btns = card.querySelectorAll('.btn');
      btns.forEach(b => b.disabled = true);

      try {
        await db.collection(collection).doc(docId).delete();
        await loadData();
      } catch (err) {
        console.error('Delete failed:', err);
        alert('Failed to delete. Check console.');
        btns.forEach(b => b.disabled = false);
      }
    }
  </script>
</body>
</html>
